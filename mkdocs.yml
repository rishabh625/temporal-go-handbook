site_name: Temporal Go SDK Handbook
site_description: The complete Temporal Go SDK cheat sheet & architectural reference for building durable, event-driven distributed systems.
site_author: Rishabh Mishra
site_url: https://rishabh625.github.io/temporal-go-handbook/
repo_url: https://github.com/rishabh625/temporal-go-handbook
repo_name: rishabh625/temporal-go-handbook

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - toc.integrate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
